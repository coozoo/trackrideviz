name: Release_Version

on:
  push:
    branches:
      - main
      - slave
  pull_request:
    branches: [ slave ]

# Creating a release and uploading its files needs a token that may write.
# Repositories created since 2023 give workflows a read-only token unless
# this is asked for (older ones, like qtjsondiff, still default to read-write).
permissions:
  contents: write

# Same scheme as qtjsondiff / qtrfpowermeter:
#   * push to main          -> build everything, create a GitHub release, upload assets
#   * push to slave / PR    -> build only, results are kept as workflow artifacts
#   * [skip ci] in the commit message skips the run
#   * [build linux] [build win] [build mac] [build mac dmg] [build mac zip]
#     in the commit message (or PR title/body) limit the non-main build to those targets
#
# main uploads the source package to ppa:coozoo/trackrideviz, signed with the
# LAUNCHPAD_GPG_KEY / LAUNCHPAD_GPG_KEY_ID / LAUNCHPAD_SSH_KEY secrets

jobs:
  check-skip:
    runs-on: ubuntu-22.04
    steps:
      - name: Check commit message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "Skipping workflow"
            exit 1
          fi
  create_release:
    name: Create release
    needs: check-skip
    runs-on: ubuntu-22.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      build_mac_dmg: ${{ steps.set_flags.outputs.build_mac_dmg }}
      build_mac_zip: ${{ steps.set_flags.outputs.build_mac_zip }}
      build_win: ${{ steps.set_flags.outputs.build_win }}
      build_lin: ${{ steps.set_flags.outputs.build_lin }}
      # the release's tag as GitHub names it, for the program to know which release it is
      release_tag: ${{ steps.build.outputs.VER_TAG_NAME }}_${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: get app version
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        id: build
      - name: Generate release notes
        id: generate_notes
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=format:"* %s (%h)" > release_notes.md
          else
            git log --pretty=format:"* %s (%h)" > release_notes.md
          fi
      - name: Debug release notes
        run: |
          echo "--- Start release_notes.md ---"
          sed -n '1,120p' release_notes.md
          echo "--- End release_notes.md ---"
      - name: Create release
        if: github.ref == 'refs/heads/main'
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          tag_name: ${{ steps.build.outputs.VER_TAG_NAME }}_${{ github.ref }}
          name: Release CI ${{ steps.build.outputs.VER_TAG_NAME }} ${{ github.ref }}
          # published at once: the other jobs upload their files into it afterwards
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set build flags from PR tags or commit message
        id: set_flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT_NAME" = "pull_request" ]]; then
            SRC="$PR_TITLE $PR_BODY"
          else
            SRC="$COMMIT_MSG"
          fi

          BUILD_MAC_DMG=0
          BUILD_MAC_ZIP=0
          BUILD_WIN=0
          BUILD_LIN=0

          if echo "$SRC" | grep -iq '\[build mac dmg\]'; then BUILD_MAC_DMG=1; fi
          if echo "$SRC" | grep -iq '\[build mac\]'; then BUILD_MAC_DMG=1; fi
          if echo "$SRC" | grep -iq '\[build mac zip\]'; then BUILD_MAC_ZIP=1; fi
          if echo "$SRC" | grep -iq '\[build win\]'; then BUILD_WIN=1; fi
          if echo "$SRC" | grep -iq '\[build linux\]'; then BUILD_LIN=1; fi

          if [[ "$BUILD_MAC_DMG" -eq 0 && "$BUILD_MAC_ZIP" -eq 0 && "$BUILD_WIN" -eq 0 && "$BUILD_LIN" -eq 0 ]]; then
            BUILD_MAC_DMG=1
            BUILD_MAC_ZIP=1
            BUILD_WIN=1
            BUILD_LIN=1
          fi

          echo "build_mac_dmg=$BUILD_MAC_DMG" >> $GITHUB_OUTPUT
          echo "build_mac_zip=$BUILD_MAC_ZIP" >> $GITHUB_OUTPUT
          echo "build_win=$BUILD_WIN" >> $GITHUB_OUTPUT
          echo "build_lin=$BUILD_LIN" >> $GITHUB_OUTPUT
  build_release:
    name: Build release
    needs: create_release
    runs-on: ${{ matrix.config.os }}
    env:
      # built into the program (see trackrideviz.pro): a release then tells when a newer one is
      # out; artifacts of other branches are no releases and never ask
      RTV_RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && needs.create_release.outputs.release_tag || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ---------------------------------------------------------------- Linux
      - name: get app version
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        id: build
      - name: install qt into linux
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        run: |
          sudo apt-get update -qq
          # the runner's own libunwind-14-dev blocks libunwind-dev, which libgstreamer1.0-dev needs
          sudo apt-get -y remove libunwind-14-dev || true
          sudo apt-get -y install debhelper dput devscripts fakeroot zsync qt6-base-dev libqt6opengl6-dev qt6-multimedia-dev libqt6svg6-dev zlib1g-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev libfuse2 qt6-image-formats-plugins \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl
          # what the AppImage's own FFmpeg is built with (tools/appimage/build-ffmpeg.sh) and bundles
          sudo apt-get -y install nasm libx264-dev libx265-dev libvpx-dev libaom-dev libsvtav1enc-dev \
            libopus-dev libvorbis-dev libmp3lame-dev libva-dev libdrm-dev
      - name: FFmpeg libraries for the AppImage (kept between runs)
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        id: ffmpegcache
        uses: actions/cache@v6
        with:
          path: /opt/ffmpeg
          key: ffmpeg-ubuntu-22.04-${{ hashFiles('tools/appimage/build-ffmpeg.sh') }}
      - name: build FFmpeg libraries for the AppImage
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1') && steps.ffmpegcache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/ffmpeg
          sudo chown "$(id -u):$(id -g)" /opt/ffmpeg
          tools/appimage/build-ffmpeg.sh /opt/ffmpeg
      - name: Update changelog
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        run: bash debian/update-changelog.sh
      - name: Set up GPG
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.LAUNCHPAD_GPG_KEY }}" | gpg --batch --import
          echo "${{ secrets.LAUNCHPAD_GPG_KEY_ID }}:6:" | gpg --import-ownertrust
      - name: Setup SSH for Launchpad
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LAUNCHPAD_SSH_KEY }}" > ~/.ssh/launchpad-ci_id_rsa
          chmod 600 ~/.ssh/launchpad-ci_id_rsa
          ssh-keyscan -t rsa git.launchpad.net >> ~/.ssh/known_hosts
      - name: Prep launchpad
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        env:
          GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
        id: launchpadid
        run: |
          dpkg-buildpackage -k"$GPG_KEY_ID" -S -sa
          echo "CHANGES_NAME=$(ls ../*.changes | head -1 | xargs -n 1 basename)" >> $GITHUB_OUTPUT
      - name: Upload package to Launchpad PPA
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        run: |
          dput ppa:coozoo/trackrideviz ../${{ steps.launchpadid.outputs.CHANGES_NAME }}
      - name: build on linux
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        id: buildlinux
        run: |
          # the package's own steps rather than dpkg-buildpackage: no .buildinfo (dpkg-genbuildinfo
          # took over a minute here) and no debug symbols package, as neither is uploaded
          DEB_BUILD_OPTIONS=noddebs debian/rules build
          DEB_BUILD_OPTIONS=noddebs fakeroot debian/rules binary
          cp ../*.deb ./
          echo "DEB_PACK_NAME=$(ls *.deb|head -1|xargs -n 1 basename)" >> $GITHUB_OUTPUT
          # translations are embedded into the binary (CONFIG += lrelease embed_translations)
          # The AppImage carries the video engine of its own, on the FFmpeg built above (the .deb
          # was built without: 22.04's FFmpeg is too old). Built again from clean, as the
          # libraries change what is compiled.
          export PKG_CONFIG_PATH=/opt/ffmpeg/lib/pkgconfig
          export LD_LIBRARY_PATH=/opt/ffmpeg/lib
          qmake6 CONFIG+=release PREFIX=/usr
          make clean
          make -j$(nproc)
          ldd ${{ steps.build.outputs.APP_NAME }} | grep -E "libav(format|codec|filter)" || { echo "::error::Built without FFmpeg's libraries"; exit 1; }
          mkdir -p appdir/usr/bin
          cp ${{ steps.build.outputs.APP_NAME }} appdir/usr/bin/${{ steps.build.outputs.APP_NAME }}
          mkdir -p appdir/usr/share/icons/hicolor/256x256/apps
          cp images/trackrideviz.png appdir/usr/share/icons/hicolor/256x256/apps/
          mkdir -p appdir/usr/share/applications/
          cp *.desktop appdir/usr/share/applications/
          mkdir -p appdir/usr/share/metainfo
          cp *.metainfo.xml appdir/usr/share/metainfo/
          mkdir -p appdir/usr/share/mime/packages
          cp trackrideviz-mime.xml appdir/usr/share/mime/packages/
          mkdir -p appdir/usr/share/${{ steps.build.outputs.APP_NAME }}
          cp -r data/gauges data/templates appdir/usr/share/${{ steps.build.outputs.APP_NAME }}/
          # go-appimage: Qt, and GStreamer with its plugins. Plain deploy, not -s: what the
          # AppImage exclude list names (glibc, libGL and GLX, X11) comes from the system, where it
          # fits the graphics driver; bundled, the GLX of the build machine could not open the
          # display (go-appimage issue #301)
          wget -c -nv https://github.com/$(wget -q https://github.com/probonopd/go-appimage/releases/expanded_assets/continuous -O - | grep "appimagetool-.*-x86_64.AppImage" | head -n 1 | cut -d '"' -f 2)
          chmod +x appimagetool-*.AppImage
          # the folder holding Qt's plugins/; not whatever QTDIR the machine has
          QTDIR=/usr/lib/x86_64-linux-gnu/qt6 ./appimagetool-*.AppImage deploy appdir/usr/share/applications/*.desktop
          # the preview plays through GStreamer: an AppImage without its plugins crashes at start
          plugins=$(find appdir -path '*gstreamer-1.0*' -name '*.so' | wc -l)
          echo "GStreamer plugins bundled: $plugins"
          find appdir -maxdepth 6 -type d -name plugins -exec ls {} \;
          if [ "$plugins" -eq 0 ]; then echo "::error::No GStreamer plugins in the AppImage"; exit 1; fi
          # Plugins that load modules of the system crash the bundled GStreamer as it looks them
          # over (LADSPA did, then waited forever): effects and synthesizers, and the bridges to
          # the graphics card's decoders. Pictures are decoded by the bundled FFmpeg (libav).
          for name in ladspa lv2 frei0r opencv fluidsynthmidi va vaapi nvcodec msdk qsv v4l2codecs; do
            find appdir -path '*gstreamer-1.0*' -name "libgst${name}.so" -print -delete
          done
          python3 tools/appimage/patch-apprun.py appdir/AppRun
          VERSION=${{ steps.build.outputs.VER_TAG_NAME }} ./appimagetool-*.AppImage ./appdir
          mv Race_Track_Visualizer-*-x86_64.AppImage ./Race_Track_Visualizer-x86_64.AppImage
          # AppImage updaters (AppImageUpdate, appimaged, Gear Lever...) take the .zsync from the latest
          # release and fetch only the changed parts; what appimagetool embedded names the file with its
          # version, so the name it has now goes in, and the .zsync is made from the final file
          rm -f Race_Track_Visualizer-*-x86_64.AppImage.zsync
          python3 tools/appimage/set-update-info.py Race_Track_Visualizer-x86_64.AppImage \
            "gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|Race_Track_Visualizer-x86_64.AppImage.zsync"
          zsyncmake -u Race_Track_Visualizer-x86_64.AppImage -o Race_Track_Visualizer-x86_64.AppImage.zsync Race_Track_Visualizer-x86_64.AppImage
          ls -l
      - name: Upload Release Asset Linux AppImage
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        id: upload-release-asset-linux-appimage
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./Race_Track_Visualizer-x86_64.AppImage
          asset_name: Race_Track_Visualizer-x86_64.AppImage
          asset_content_type: application/octet-stream
      - name: Upload Release Asset Linux AppImage zsync
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./Race_Track_Visualizer-x86_64.AppImage.zsync
          asset_name: Race_Track_Visualizer-x86_64.AppImage.zsync
          asset_content_type: application/octet-stream
      - name: Upload deb to release
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        id: upload-release-asset-linux-deb
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ steps.buildlinux.outputs.DEB_PACK_NAME }}
          asset_name: ${{ steps.buildlinux.outputs.DEB_PACK_NAME }}
          asset_content_type: application/octet-stream
      - name: Archive Linux AppImage
        if: matrix.config.os == 'ubuntu-22.04' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_lin == '1'
        uses: actions/upload-artifact@v7
        with:
          name: Race_Track_Visualizer-x86_64.AppImage
          path: ./Race_Track_Visualizer-x86_64.AppImage
          overwrite: true

      # ---------------------------------------------------------------- macOS
      - name: get app version
        if: matrix.config.os == 'macos-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_mac_dmg == '1' || needs.create_release.outputs.build_mac_zip == '1')
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        id: buildosx
      - name: install qt OSX
        if: matrix.config.os == 'macos-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_mac_dmg == '1' || needs.create_release.outputs.build_mac_zip == '1')
        # ffmpeg: its libraries are the program's own video engine, bundled by macdeployqt
        run: brew install qt ffmpeg pkgconf
      - name: buid OSX
        if: matrix.config.os == 'macos-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_mac_dmg == '1' || needs.create_release.outputs.build_mac_zip == '1')
        run: |
          chmod 777 MAC_build_RELEASE.sh
          ./MAC_build_RELEASE.sh
          ls -l
          otool -L ${{ steps.buildosx.outputs.APP_NAME }}.app/Contents/MacOS/${{ steps.buildosx.outputs.APP_NAME }} | grep -E "libav(format|codec|filter)" \
            || { echo "::error::Built without FFmpeg's libraries"; exit 1; }
          ZIP_NAME="$(ls ${{ steps.buildosx.outputs.APP_NAME }}_*.zip | head -n1)"
          DMG_NAME="$(ls ${{ steps.buildosx.outputs.APP_NAME }}_*.dmg | head -n1)"
          echo "zip found: $ZIP_NAME"
          echo "dmg found: $DMG_NAME"
          echo "MAC_ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "MAC_DMG_NAME=$DMG_NAME" >> $GITHUB_OUTPUT
        id: bundleosx
      - name: Upload Release Asset dmg
        if: matrix.config.os == 'macos-latest' && github.ref == 'refs/heads/main'
        id: upload-release-asset-dmg
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.bundleosx.outputs.MAC_DMG_NAME }}
          asset_name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.dmg
          asset_content_type: application/octet-stream
      - name: Upload Release Asset zip
        if: matrix.config.os == 'macos-latest' && github.ref == 'refs/heads/main'
        id: upload-release-asset-zip
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.bundleosx.outputs.MAC_ZIP_NAME }}
          asset_name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.zip
          asset_content_type: application/zip
      - name: Archive macOS zip
        if: matrix.config.os == 'macos-latest' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_mac_zip == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.zip
          path: ./${{ steps.bundleosx.outputs.MAC_ZIP_NAME }}
          overwrite: true
      - name: Archive macOS dmg
        if: matrix.config.os == 'macos-latest' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_mac_dmg == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.dmg
          path: ./${{ steps.bundleosx.outputs.MAC_DMG_NAME }}
          overwrite: true

      # -------------------------------------------------------------- Windows
      - name: Setup MSYS2 env
        if: matrix.config.os == 'windows-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_win == '1')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            git
            p7zip
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-multimedia-ffmpeg
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-nsis
            tar
      - name: get app version
        if: matrix.config.os == 'windows-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_win == '1')
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        shell: msys2 {0}
        id: buildwin
      - name: make 64 win app
        if: matrix.config.os == 'windows-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_win == '1')
        run: |
          ls -l
          pwd
          set MSYSTEM=MINGW64
          ROOTMSYS=/d/a/_temp/msys64/mingw64
          export PATH=$ROOTMSYS/bin:$PATH
          ls -l $ROOTMSYS/bin | grep qmake || echo "qmake not found"
          $ROOTMSYS/bin/qmake6 --version || echo "qmake failed to run"
          # FFmpeg's libraries for the video engine of the program's own, through pkg-config
          export PKG_CONFIG=$ROOTMSYS/bin/pkg-config.exe
          qmake6
          make -j$(nproc)
          objdump -p release/${{ steps.buildwin.outputs.APP_NAME }}.exe | grep -iE "DLL Name: av(format|codec|filter)" \
            || { echo "::error::Built without FFmpeg's libraries"; exit 1; }
          rm -f release/*.o; rm -f release/*.cpp; rm -f release/*.h
          # gauges and templates that come with the program, next to the .exe
          mkdir -p release/data
          cp -r data/gauges data/templates release/data/
          windeployqt6.exe release/${{ steps.buildwin.outputs.APP_NAME }}.exe
          # windeployqt brings Qt alone; the MinGW DLLs Qt, its plugins and FFmpeg load are named
          # here. FFmpeg's codec libraries above all: without them the video plugin does not
          # load and no video opens. libcrypto and libssl: map tiles come over https.
          shopt -s nullglob
          DLL_PATTERNS=(
            "zlib*.dll" "libgcc*.dll" "libwinpthread*.dll" "libstdc*.dll"
            "libdouble*.dll" "libicuin*.dll" "libicuuc*.dll" "libicudt*.dll"
            "libpcre*.dll" "libzstd*.dll" "libharfbuzz*.dll" "libgraphite*.dll"
            "libfreetype*.dll" "libb*.dll" "libpng*.dll" "libglib*.dll" "libintl*.dll"
            "libiconv*.dll" "libcrypto*.dll" "libssl*.dll" "libmd4c*.dll"
            "avcodec*.dll" "avformat*.dll" "avutil*.dll" "swscale*.dll" "swresample*.dll"
            "libva.dll" "libva_win32.dll" "libvpl*.dll" "libsoxr.dll" "libgomp*.dll"
            "libaom.dll" "libdav1d*.dll" "librav1e.dll" "libSvtAv1Enc*.dll" "libsvtav1enc*.dll"
            "libx264*.dll" "libx265*.dll" "xvidcore.dll" "libvpx*.dll"
            "libopus*.dll" "libvorbis*.dll" "libogg*.dll" "libtheora*.dll" "libmp3lame*.dll"
            "libspeex*.dll" "libgsm.dll" "liblc3*.dll" "libopencore-amrnb*.dll" "libopencore-amrwb*.dll"
            "libopenjp2*.dll" "libjxl*.dll" "libhwy.dll" "liblcms2*.dll"
            "libwebp*.dll" "libsharpyuv*.dll" "libjpeg*.dll" "libtiff*.dll" "libdeflate.dll"
            "libjbig*.dll" "libLerc.dll" "liblzma*.dll" "libjasper*.dll" "libmng*.dll"
            "libzvbi*.dll" "libxml2*.dll" "libbluray*.dll" "libgme.dll" "libmodplug*.dll"
            "librtmp*.dll" "libsrt.dll" "libssh.dll"
            "libgnutls*.dll" "libgmp*.dll" "libhogweed*.dll" "libnettle*.dll" "libidn2*.dll"
            "libp11-kit*.dll" "libtasn1*.dll" "libunistring*.dll"
            "librsvg*.dll" "libcairo*.dll" "liblzo2*.dll" "libpixman*.dll" "libfontconfig*.dll" "libexpat*.dll"
            "libpango*.dll" "libfribidi*.dll" "libthai*.dll" "libdatrie*.dll"
            "libgdk_pixbuf*.dll" "libgio*.dll" "libgobject*.dll" "libgmodule*.dll" "libffi*.dll"
            # and what ffmpeg.exe and ffprobe.exe load besides: devices and filters
            "avdevice*.dll" "avfilter*.dll" "libcaca*.dll" "libopenal*.dll"
            # not vulkan-1.dll here: one next to the program is loaded by the graphics stack too
            # (under Wine it then recursed until the stack overflowed); ffmpeg gets it in ffmpeg/
            "libplacebo*.dll" "libdovi.dll" "libshaderc_shared.dll" "libspirv-cross-c-shared.dll"
            "libass*.dll" "libunibreak*.dll" "libvidstab.dll" "libzimg*.dll"
            "libz-1*.dll" "libwhisper*.dll" "ggml*.dll"
          )
          for pattern in "${DLL_PATTERNS[@]}"; do
            files=("$ROOTMSYS/bin"/$pattern)
            if [ ${#files[@]} -gt 0 ]; then
              cp -u "${files[@]}" release/
            fi
          done
          shopt -u nullglob
          # export and the music's lengths run ffmpeg and ffprobe: in ffmpeg/ with vulkan-1.dll,
          # which their filters (libplacebo) import and Windows without a graphics driver lacks;
          # the other DLLs above they find in the program's folder, which the program puts on
          # their PATH. Not beside the program: Wine's graphics would load it there and recurse
          mkdir -p release/ffmpeg
          cp $ROOTMSYS/bin/ffmpeg.exe $ROOTMSYS/bin/ffprobe.exe $ROOTMSYS/bin/vulkan-1.dll release/ffmpeg/
          # OpenGL in software, Qt's own build of Mesa llvmpipe: where the graphics driver offers
          # none worth having (Microsoft Basic Render Driver in a virtual machine, remote
          # desktops, old drivers) Qt loads it by itself; without it the window stays empty
          curl -fsSL -o opengl32sw.7z https://download.qt.io/development_releases/prebuilt/llvmpipe/windows/opengl32sw-64-mesa_11_2_2-signed_sha256.7z
          echo "c61f801c1760aa24b02c7a8354323cddf368b86f8f5c34b50b3b224f7d728afd  opengl32sw.7z" | sha256sum -c -
          7z x -y -orelease opengl32sw.7z opengl32sw.dll
          rm opengl32sw.7z
          mv release ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64; 7z -tzip a ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64/
          # the same folder as an installer, for those who would rather install than unpack
          MAKENSIS=$ROOTMSYS/bin/makensis.exe windows/make-installer.sh \
            ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64 \
            "$(cat main.cpp | grep 'const QString APP_VERSION' | awk -F\" '{print $2;}')" \
            ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64_setup.exe
          ls -l
        shell: msys2 {0}
      - name: Upload Release Asset Win64
        if: matrix.config.os == 'windows-latest' && github.ref == 'refs/heads/main'
        id: upload-release-asset-win64
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          asset_name: ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          asset_content_type: application/zip
      - name: Upload Release Asset Win64 installer
        if: matrix.config.os == 'windows-latest' && github.ref == 'refs/heads/main'
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64_setup.exe
          asset_name: ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64_setup.exe
          asset_content_type: application/vnd.microsoft.portable-executable
      - name: Archive Win64 zip
        if: matrix.config.os == 'windows-latest' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_win == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          path: ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          overwrite: true
      - name: Archive Win64 installer
        if: matrix.config.os == 'windows-latest' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_win == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64_setup.exe
          path: ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64_setup.exe
          overwrite: true
