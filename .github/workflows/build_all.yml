name: Release_Version

on:
  push:
    branches:
      - main
      - slave
  pull_request:
    branches: [ slave ]

# Creating a release and uploading its files needs a token that may write.
# Repositories created since 2023 give workflows a read-only token unless
# this is asked for (older ones, like qtjsondiff, still default to read-write).
permissions:
  contents: write

# Same scheme as qtjsondiff / qtrfpowermeter:
#   * push to main          -> build everything, create a GitHub release, upload assets
#   * push to slave / PR    -> build only, results are kept as workflow artifacts
#   * [skip ci] in the commit message skips the run
#   * [build linux] [build win] [build mac] [build mac dmg] [build mac zip]
#     in the commit message (or PR title/body) limit the non-main build to those targets
#
# Launchpad PPA upload is off until the PPA exists: create ppa:coozoo/trackrideviz, add the
# LAUNCHPAD_GPG_KEY / LAUNCHPAD_GPG_KEY_ID / LAUNCHPAD_SSH_KEY secrets, then set the
# repository variable LAUNCHPAD_PPA to  ppa:coozoo/trackrideviz

jobs:
  check-skip:
    runs-on: ubuntu-22.04
    steps:
      - name: Check commit message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "Skipping workflow"
            exit 1
          fi
  create_release:
    name: Create release
    needs: check-skip
    runs-on: ubuntu-22.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      build_mac_dmg: ${{ steps.set_flags.outputs.build_mac_dmg }}
      build_mac_zip: ${{ steps.set_flags.outputs.build_mac_zip }}
      build_win: ${{ steps.set_flags.outputs.build_win }}
      build_lin: ${{ steps.set_flags.outputs.build_lin }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: get app version
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        id: build
      - name: Generate release notes
        id: generate_notes
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=format:"* %s (%h)" > release_notes.md
          else
            git log --pretty=format:"* %s (%h)" > release_notes.md
          fi
      - name: Debug release notes
        run: |
          echo "--- Start release_notes.md ---"
          sed -n '1,120p' release_notes.md
          echo "--- End release_notes.md ---"
      - name: Create release
        if: github.ref == 'refs/heads/main'
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          tag_name: ${{ steps.build.outputs.VER_TAG_NAME }}_${{ github.ref }}
          name: Release CI ${{ steps.build.outputs.VER_TAG_NAME }} ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set build flags from PR tags or commit message
        id: set_flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT_NAME" = "pull_request" ]]; then
            SRC="$PR_TITLE $PR_BODY"
          else
            SRC="$COMMIT_MSG"
          fi

          BUILD_MAC_DMG=0
          BUILD_MAC_ZIP=0
          BUILD_WIN=0
          BUILD_LIN=0

          if echo "$SRC" | grep -iq '\[build mac dmg\]'; then BUILD_MAC_DMG=1; fi
          if echo "$SRC" | grep -iq '\[build mac\]'; then BUILD_MAC_DMG=1; fi
          if echo "$SRC" | grep -iq '\[build mac zip\]'; then BUILD_MAC_ZIP=1; fi
          if echo "$SRC" | grep -iq '\[build win\]'; then BUILD_WIN=1; fi
          if echo "$SRC" | grep -iq '\[build linux\]'; then BUILD_LIN=1; fi

          if [[ "$BUILD_MAC_DMG" -eq 0 && "$BUILD_MAC_ZIP" -eq 0 && "$BUILD_WIN" -eq 0 && "$BUILD_LIN" -eq 0 ]]; then
            BUILD_MAC_DMG=1
            BUILD_MAC_ZIP=1
            BUILD_WIN=1
            BUILD_LIN=1
          fi

          echo "build_mac_dmg=$BUILD_MAC_DMG" >> $GITHUB_OUTPUT
          echo "build_mac_zip=$BUILD_MAC_ZIP" >> $GITHUB_OUTPUT
          echo "build_win=$BUILD_WIN" >> $GITHUB_OUTPUT
          echo "build_lin=$BUILD_LIN" >> $GITHUB_OUTPUT
  build_release:
    name: Build release
    needs: create_release
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ---------------------------------------------------------------- Linux
      - name: get app version
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        id: build
      - name: install qt into linux
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install debhelper dput devscripts qt6-base-dev libqt6opengl6-dev qt6-multimedia-dev qt6-svg-dev zlib1g-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev libfuse2 qt6-image-formats-plugins
      - name: Update changelog
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        run: bash debian/update-changelog.sh
      - name: Set up GPG
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main' && vars.LAUNCHPAD_PPA != ''
        run: |
          echo "${{ secrets.LAUNCHPAD_GPG_KEY }}" | gpg --batch --import
          echo "${{ secrets.LAUNCHPAD_GPG_KEY_ID }}:6:" | gpg --import-ownertrust
      - name: Setup SSH for Launchpad
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main' && vars.LAUNCHPAD_PPA != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LAUNCHPAD_SSH_KEY }}" > ~/.ssh/launchpad-ci_id_rsa
          chmod 600 ~/.ssh/launchpad-ci_id_rsa
          ssh-keyscan -t rsa git.launchpad.net >> ~/.ssh/known_hosts
      - name: Prep launchpad
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main' && vars.LAUNCHPAD_PPA != ''
        env:
          GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
        id: launchpadid
        run: |
          dpkg-buildpackage -k"$GPG_KEY_ID" -S -sa
          echo "CHANGES_NAME=$(ls ../*.changes | head -1 | xargs -n 1 basename)" >> $GITHUB_OUTPUT
      - name: Upload package to Launchpad PPA
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main' && vars.LAUNCHPAD_PPA != ''
        run: |
          dput ${{ vars.LAUNCHPAD_PPA }} ../${{ steps.launchpadid.outputs.CHANGES_NAME }}
      - name: build on linux
        if: matrix.config.os == 'ubuntu-22.04' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_lin == '1')
        id: buildlinux
        run: |
          dpkg-buildpackage -us -uc -b
          cp ../*.deb ./
          echo "DEB_PACK_NAME=$(ls *.deb|head -1|xargs -n 1 basename)" >> $GITHUB_OUTPUT
          # translations are embedded into the binary (CONFIG += lrelease embed_translations)
          qmake6 CONFIG+=release PREFIX=/usr
          make -j$(nproc)
          mkdir -p appdir/usr/bin
          cp ${{ steps.build.outputs.APP_NAME }} appdir/usr/bin/${{ steps.build.outputs.APP_NAME }}
          mkdir -p appdir/usr/share/icons/
          cp images/trackrideviz.png appdir/usr/share/icons/
          mkdir -p appdir/usr/share/applications/
          cp *.desktop appdir/usr/share/applications/
          mkdir -p appdir/usr/share/${{ steps.build.outputs.APP_NAME }}
          cp -r data/gauges data/templates appdir/usr/share/${{ steps.build.outputs.APP_NAME }}/
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage appdir/usr/share/applications/*.desktop -appimage -qmake=$(command -v qmake6)
          ls -l
          cp ./Race_Track_Visualizer*.AppImage ./Race_Track_Visualizer-x86_64.AppImage
          ls -l
      - name: Upload Release Asset Linux AppImage
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        id: upload-release-asset-linux-appimage
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./Race_Track_Visualizer-x86_64.AppImage
          asset_name: Race_Track_Visualizer-x86_64.AppImage
          asset_content_type: application/octet-stream
      - name: Upload deb to release
        if: matrix.config.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main'
        id: upload-release-asset-linux-deb
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ steps.buildlinux.outputs.DEB_PACK_NAME }}
          asset_name: ${{ steps.buildlinux.outputs.DEB_PACK_NAME }}
          asset_content_type: application/octet-stream
      - name: Archive Linux AppImage
        if: matrix.config.os == 'ubuntu-22.04' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_lin == '1'
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Race_Track_Visualizer-x86_64.AppImage
          path: ./Race_Track_Visualizer-x86_64.AppImage
          overwrite: true

      # ---------------------------------------------------------------- macOS
      - name: get app version
        if: matrix.config.os == 'macos-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_mac_dmg == '1' || needs.create_release.outputs.build_mac_zip == '1')
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        id: buildosx
      - name: install qt OSX
        if: matrix.config.os == 'macos-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_mac_dmg == '1' || needs.create_release.outputs.build_mac_zip == '1')
        run: brew install qt
      - name: buid OSX
        if: matrix.config.os == 'macos-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_mac_dmg == '1' || needs.create_release.outputs.build_mac_zip == '1')
        run: |
          chmod 777 MAC_build_RELEASE.sh
          ./MAC_build_RELEASE.sh
          ls -l
          ZIP_NAME="$(ls ${{ steps.buildosx.outputs.APP_NAME }}_*.zip | head -n1)"
          DMG_NAME="$(ls ${{ steps.buildosx.outputs.APP_NAME }}_*.dmg | head -n1)"
          echo "zip found: $ZIP_NAME"
          echo "dmg found: $DMG_NAME"
          echo "MAC_ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "MAC_DMG_NAME=$DMG_NAME" >> $GITHUB_OUTPUT
        id: bundleosx
      - name: Upload Release Asset dmg
        if: matrix.config.os == 'macos-latest' && github.ref == 'refs/heads/main'
        id: upload-release-asset-dmg
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.bundleosx.outputs.MAC_DMG_NAME }}
          asset_name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.dmg
          asset_content_type: application/octet-stream
      - name: Upload Release Asset zip
        if: matrix.config.os == 'macos-latest' && github.ref == 'refs/heads/main'
        id: upload-release-asset-zip
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.bundleosx.outputs.MAC_ZIP_NAME }}
          asset_name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.zip
          asset_content_type: application/zip
      - name: Archive macOS zip
        if: matrix.config.os == 'macos-latest' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_mac_zip == '1'
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.zip
          path: ./${{ steps.bundleosx.outputs.MAC_ZIP_NAME }}
          overwrite: true
      - name: Archive macOS dmg
        if: matrix.config.os == 'macos-latest' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_mac_dmg == '1'
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ steps.buildosx.outputs.APP_NAME }}_${{ steps.buildosx.outputs.VER_TAG_NAME }}.dmg
          path: ./${{ steps.bundleosx.outputs.MAC_DMG_NAME }}
          overwrite: true

      # -------------------------------------------------------------- Windows
      - name: Setup MSYS2 env
        if: matrix.config.os == 'windows-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_win == '1')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            git
            p7zip
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-qt6-tools
            tar
      - name: get app version
        if: matrix.config.os == 'windows-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_win == '1')
        run: |
          echo "VER_TAG_NAME=$(cat main.cpp |grep 'const QString APP'|awk -F\" '{print $2;}')-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(cat *.pro |grep 'TARGET ='|awk -F\= '{print $2;}'| tr -d ' ')" >> $GITHUB_OUTPUT
        shell: msys2 {0}
        id: buildwin
      - name: make 64 win app
        if: matrix.config.os == 'windows-latest' && (github.ref == 'refs/heads/main' || needs.create_release.outputs.build_win == '1')
        run: |
          ls -l
          pwd
          set MSYSTEM=MINGW64
          ROOTMSYS=/d/a/_temp/msys64/mingw64
          export PATH=$ROOTMSYS/bin:$PATH
          ls -l $ROOTMSYS/bin | grep qmake || echo "qmake not found"
          $ROOTMSYS/bin/qmake6 --version || echo "qmake failed to run"
          qmake6
          make -j$(nproc)
          rm -f release/*.o; rm -f release/*.cpp; rm -f release/*.h
          # gauges and templates that come with the program, next to the .exe
          mkdir -p release/data
          cp -r data/gauges data/templates release/data/
          windeployqt6.exe release/${{ steps.buildwin.outputs.APP_NAME }}.exe
          # MinGW runtime and Qt's own dependencies that windeployqt does not pick up
          for pattern in 'libgcc*' 'libwinpthread*' 'libstdc*' 'libdouble*' 'libicuin*' 'libicuuc*' 'libicudt*' 'libpcre*' 'libzstd*' 'libharfbuzz*' 'libgraphite*' 'libfreetype*' 'libbrotlidec*' 'libbrotlicommon*' 'libbz*' 'libpng*' 'libglib*' 'libintl*' 'libiconv*' 'libb2*' 'libmd4c*' 'zlib*'; do
            cp $ROOTMSYS/bin/$pattern.dll release/ 2>/dev/null || echo "no dll matches $pattern"
          done
          mv release ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64; 7z -tzip a ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64/
          ls -l
        shell: msys2 {0}
      - name: Upload Release Asset Win64
        if: matrix.config.os == 'windows-latest' && github.ref == 'refs/heads/main'
        id: upload-release-asset-win64
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          asset_name: ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          asset_content_type: application/zip
      - name: Archive Win64 zip
        if: matrix.config.os == 'windows-latest' && github.ref != 'refs/heads/main' && needs.create_release.outputs.build_win == '1'
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          path: ./${{ steps.buildwin.outputs.APP_NAME }}_${{ steps.buildwin.outputs.VER_TAG_NAME }}_WIN64.zip
          overwrite: true
