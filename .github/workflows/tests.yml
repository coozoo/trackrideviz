name: Tests

on:
  push:
  pull_request:

jobs:
  check-skip:
    runs-on: ubuntu-latest
    steps:
      - name: Check commit message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "Skipping workflow"
            exit 1
          fi

  unit-tests:
    name: Unit tests (Qt6 on ubuntu-latest)
    runs-on: ubuntu-latest
    needs: check-skip
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The packages downloaded are kept between runs, as in build_all.yml (the mirror once took
      # 12 minutes): still installed every time, only not fetched again
      - name: runner image
        id: image
        run: echo "version=${ImageOS:-ubuntu}-${ImageVersion:-none}" >> $GITHUB_OUTPUT
      - name: apt downloads (kept between runs)
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-tests-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: apt-tests-

      - name: Install Qt 6 + deps
        run: |
          mkdir -p ~/apt-cache/partial
          echo "Dir::Cache::Archives \"$HOME/apt-cache\";" | sudo tee /etc/apt/apt.conf.d/99downloads-kept
          sudo apt-get update -qq
          sudo apt-get install -y \
            qt6-base-dev \
            libqt6opengl6-dev \
            qt6-multimedia-dev \
            qt6-declarative-dev \
            libqt6svg6-dev \
            zlib1g-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libgl1-mesa-dev \
            ffmpeg \
            pkg-config \
            libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev libswresample-dev
          # versions no longer on the mirror go; the rest readable for the cache to be saved
          sudo apt-get autoclean -qq
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      # Only the Makefile with the check target: the program itself is compiled by the release
      # workflow, and check builds the core and the tests on their own
      - name: Shadow build (Debug, with tests target)
        run: |
          mkdir -p build/Desktopqt6-Debug
          cd build/Desktopqt6-Debug
          qmake6 ../../trackrideviz.pro CONFIG+=debug CONFIG+=tests

      - name: Run unit tests
        working-directory: build/Desktopqt6-Debug
        env:
          QT_QPA_PLATFORM: offscreen
        run: make -j$(nproc) check
